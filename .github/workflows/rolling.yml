# SPDX-License-Identifier: GPL-3.0-or-later
#
# The rolling build: after every green CI run on main, the player of exactly that commit is built and put
# on the pre-release `latest`, whose file is replaced each time. It is for looking at the newest state,
# not a release: no version tag, not signed. A release (v0.1.0) comes with Gate 0 (rule NREL-07).
#
#   takt-windows-x86_64.zip   takt-player.exe, install.ps1, uninstall.ps1, LICENSE, README.md, VERSION;
#                             VERSION says <version>+<short commit>, which the install shows in Settings > Apps
#   SHA256SUMS                the checksum of the zip
#
# Runs on the hosted Windows runners (takt is public and has no runner of its own, unlike pult); only
# Windows is built, the install scripts are Windows ones. appkit is public and read without credentials.
#
# Deciding (only the tip of main is built) and publishing (SHA256SUMS first, the words of the page last) are
# the actions prepare and publish of appkit's release-kit, pinned by commit, as in pult. The build is ours:
# its file goes to publish as an artifact.
#
# Actions are pinned by commit (NREL-03); a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Only the run of the TIP of main may build, and a newer tip replaces a build that is still running: the
# pre-release must end on the newest commit. This is kept per job, never for the whole workflow: a
# workflow-level `cancel-in-progress` would also kill a `publish` that is halfway through replacing the
# zip and the checksums, and the pre-release would be left without a file. So `build` is cancelled by a
# newer build (group `rolling-build-true`; a run that is not the tip has `current` false and lands in a
# group of its own, it builds nothing), and `publish` is never cancelled: a newer publish waits for it,
# and a late older one finds that main has moved on and does nothing (step "Is it still the tip").
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Git Bash of the hosted runner.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
      short: ${{ steps.prepare.outputs.short }}
    steps:
      - id: prepare
        uses: WKDSteve/appkit/release-kit/prepare@22039af47757bb4ba69770600fc647cd304d3b30 # v0.47.0
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    concurrency:
      group: rolling-build-${{ needs.prepare.outputs.current }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml when it is missing.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the player
        run: cargo build --release --locked -p takt-player
      - name: Pack
        id: pack
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          rm -rf dist
          pwsh -NoProfile -File scripts/package-release.ps1 -BuildDir target/release -OutDir dist -Sha "$SHA"
          test -f dist/takt-windows-x86_64.zip
          echo "file=dist/takt-windows-x86_64.zip" >> "$GITHUB_OUTPUT"
      # The version label of the zip must name the commit of this build: <version>+<short commit>.
      - name: Check the archive
        env:
          FILE: ${{ steps.pack.outputs.file }}
          SHORT: ${{ needs.prepare.outputs.short }}
        run: |
          set -eu
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' apps/takt-player/Cargo.toml | head -n 1)"
          pwsh -NoProfile -File scripts/test-release.ps1 -BuildDir target/release -Zip "$FILE" -Label "${crate}+${SHORT}"
      # Only the zip goes on: the SHA256SUMS next to it is made again by the publish action.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-windows
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  # The file and the checksums go up in one job; the words of the page move last, so only then does it name this
  # commit.
  publish:
    needs: [prepare, build]
    # Never cancelled once running (see above); a newer publish waits for this one.
    concurrency:
      group: rolling-publish
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # A publish that waited behind a newer one must not put its older commit over it.
      - name: Is it still the tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $tip: $SHA is not published"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.tip.outputs.current == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # The folder must hold the one downloaded zip and nothing from an earlier job of this runner.
      - name: Empty dist
        if: ${{ steps.tip.outputs.current == 'true' }}
        run: rm -rf dist
      - if: ${{ steps.tip.outputs.current == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - if: ${{ steps.tip.outputs.current == 'true' }}
        uses: WKDSteve/appkit/release-kit/publish@22039af47757bb4ba69770600fc647cd304d3b30 # v0.47.0
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 1
          app: takt
          notes-file: .github/rolling-notes.md
