# SPDX-License-Identifier: GPL-3.0-or-later
#
# Cross-Platform ab Commit eins. Nicht "spaeter ergaenzen": der Moment, in dem
# eine Plattform drei Wochen nicht gebaut wurde, ist der Moment, in dem sie
# kaputt ist.
#
# macOS laeuft mit, obwohl es kein Testgeraet gibt. Ein gruener Build ist keine
# Zusage, dass es dort gut laeuft — aber ein roter Build ist der Beweis, dass
# es das nicht tut.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job writes to the repository: the token of a run may read it and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      # The branch `stable` of the action at its commit of that day; the toolchain is an input then.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: ALSA- und D-Bus-Header (cpal unter Linux, rtkit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Tests
        shell: bash
        run: cargo test --workspace --all-features 2>&1 | tee test.log
      # Ignored tests are no evidence (TST-16): their number and reasons go into the summary of the run.
      - name: SKIPs in die Zusammenfassung
        if: always()
        shell: bash
        run: python3 scripts/ci-skip-summary.py test.log --title "Tests ${{ matrix.os }}"
      # takt-gpu on an adapter: the shader against the reference pictures, four layers, and the import of a texture
      # another device wrote (D3D11, shared) against the upload of its planes. The runners have no GPU; on Windows the
      # software adapter of DX12 (WARP) renders it. Linux and macOS keep these tests ignored.
      - name: takt-gpu auf einem Adapter (Windows, WARP)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Two test threads, named: with one, the harness prints the name of a test before its output and the
          # lines below would not match.
          cargo test -p takt-gpu gpu -- --ignored --nocapture --test-threads=2 2>&1 | tee gpu.log
          # The tests must have rendered, not said SKIP.
          grep -q "test gpu_the_shader_draws_the_reference_pictures ... ok" gpu.log
          grep -q "test gpu_four_layers_are_blended_bottom_to_top_in_their_rectangles ... ok" gpu.log
          grep -q "test import::gpu_an_imported_texture_draws_the_bytes_the_upload_of_its_planes_draws ... ok" gpu.log
          grep -q "test import::gpu_a_frame_is_given_back_only_after_the_gpu_is_done_with_it ... ok" gpu.log
        env:
          TAKT_GPU_TESTS: "1"
          TAKT_GPU_ADAPTER: fallback
      # Packing, install and uninstall of the rolling zip, with a stand-in program and throw-away places; and
      # the entry of Settings > Apps, which is the player itself (takt-player --uninstall): the build of this
      # job removes a temp install with it.
      - name: Install-Skripte und Deinstallation durch das Programm (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build -p takt-player
          pwsh -NoProfile -File scripts/test-release.ps1 -AppExe target/debug/takt-player.exe
      # The same for the archive of Linux and macOS (scripts/package-release.py, install.sh, uninstall.sh), with a
      # stand-in program and throw-away places.
      - name: Packer, Install- und Deinstallations-Skripte (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/test-release.sh
      - name: Doku baut ohne fehlende Verweise
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  text:
    name: Keine Steuerzeichen in Textdateien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - name: Steuerzeichen-Guard (NREL-14)
        run: python3 scripts/check-control-chars.py
      - name: Jede uses-Zeile per SHA gepinnt (NREL-03)
        run: python3 scripts/check-action-pins.py
      # scripts/uninstall-entry.ps1 is the file of appkit's release kit at the commit the workflows pin it to (copy of
      # appkit's tools/check-release-kit-copy.py).
      - name: uninstall-entry.ps1 ist die Datei des gepinnten release-kit
        run: python3 scripts/check-release-kit-copy.py

  # libmpv from the distribution (a GPL build, accepted for zone 2 on 2026-10-31): the link smoke test runs for
  # real here; without it the test says SKIP. FFmpeg of Ubuntu is a GPL build and stays out (build_is_lgpl).
  libmpv-linux:
    name: libmpv gelinkt (Ubuntu, apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: ALSA-, D-Bus- und libmpv-Header
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libmpv-dev pkg-config
      # The recipe of docs/BUILD.md (section Linux), word for word.
      - name: Link-Test gegen libmpv (Rezept aus BUILD.md)
        # bash, named: GitHub then runs it with -eo pipefail, and a red test behind `| tee` ends the step. Without
        # it the exit code of cargo was lost in the pipe and the step stayed green with a failed test.
        shell: bash
        run: |
          echo "libmpv $(pkg-config --modversion mpv) in $(pkg-config --variable=libdir mpv)"
          TAKT_LIBMPV_DIR="$(pkg-config --variable=libdir mpv)" && [ -n "$TAKT_LIBMPV_DIR" ] \
              && export TAKT_LIBMPV_DIR && cargo test -p takt-player --test ffi_native_link -- --nocapture 2>&1 | tee test.log
          # The cfg must have come on: both libmpv tests ran, not the stand-in that says SKIP.
          grep -q "test libmpv::client_api_is_version_2 ... ok" test.log
          grep -q "test libmpv::license_state_matches_build_md ... ok" test.log
          # The module mpv exists only with the cfg: no other job compiles, lints or tests it.
          cargo clippy -p takt-player --all-targets --all-features
          # All tests of the player in the build with libmpv: the MpvBackend plays the test file of the repository
          # (apps/takt-player/tests/data), silent (ao=null), and the session swaps its clock.
          cargo test -p takt-player -- --nocapture 2>&1 | tee -a test.log
          grep -q "test mpv::tests::a_test_pattern_is_rendered_into_memory ... ok" test.log
          grep -q "test mpv::ffi::tests::a_text_with_a_nul_byte_is_no_source ... ok" test.log
          grep -q "test mpv::backend::tests::a_file_plays_pauses_jumps_and_ends ... ok" test.log
          grep -q "test mpv::backend::tests::a_core_for_files_fetches_nothing_from_the_network ... ok" test.log
          grep -q "test session::tests::a_file_swaps_the_clock_and_the_test_picture_swaps_it_back ... ok" test.log
      - name: SKIPs in die Zusammenfassung
        if: always()
        run: python3 scripts/ci-skip-summary.py test.log --title "libmpv (Ubuntu)"

  # libmpv on Windows: the very build the measurements in docs/reviews/phase-0.md were made with (docs/BUILD.md,
  # section Windows; a GPL build, accepted for zone 2 on 2026-10-31; pinning it here was decided on 2026-11-14).
  # The archive comes from its publisher and is taken only with the SHA-256 below. The publisher keeps its last 30
  # releases: once this one is gone and the cache has dropped it, the job says SKIP in a warning and in the
  # summary, and counts as no evidence (TST-16); then pin a newer archive here and in docs/BUILD.md. A file with
  # another hash fails the job.
  #
  # The job also gets the FFmpeg of the job below (same archive, same pin): with libmpv and FFmpeg in one build the
  # own pipeline (takt-demux, takt-decode) is compared with libmpv picture by picture (apps/takt-player/src/compare.rs)
  # and the two backends are swapped while a file plays. Without the FFmpeg archive those tests do not exist; the
  # job says SKIP for them then and stays what it was.
  libmpv-windows:
    name: libmpv gelinkt (Windows, Archiv gepinnt)
    runs-on: windows-latest
    env:
      MPV_TAG: "20261111"
      MPV_ARCHIVE: mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
      MPV_SHA256: 273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452
      FFMPEG_TAG: autobuild-2026-10-31-12-59
      FFMPEG_ARCHIVE: ffmpeg-n9.0.2-39-g7adfbe40dc-win64-lgpl-shared-9.0.zip
      FFMPEG_SHA256: e907b01fa4783913151237e37df2a10fa97d99a1598a021bf59d4ae62ffed4c0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
        # The tests load a library that is not ours: the token of the run does not stay in the checkout.
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, resolved 2026-11-14
        with:
          path: mpv-dev.7z
          key: libmpv-windows-${{ env.MPV_SHA256 }}
      - name: Archiv holen und gegen den SHA-256 pruefen
        id: archive
        shell: pwsh
        run: |
          $file = 'mpv-dev.7z'
          if (-not (Test-Path -LiteralPath $file)) {
              $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:MPV_TAG/$env:MPV_ARCHIVE"
              try {
                  Invoke-WebRequest -Uri $url -OutFile $file -MaximumRetryCount 3 -RetryIntervalSec 5
              }
              catch {
                  $status = 0
                  if ($_.Exception.Response) { $status = [int] $_.Exception.Response.StatusCode }
                  if ($status -ne 404) { throw }
                  $why = "$env:MPV_ARCHIVE is gone from its publisher (HTTP 404): nothing of libmpv was built or tested on Windows. Pin a newer archive in ci.yml and docs/BUILD.md."
                  Write-Output "::warning title=SKIP libmpv (Windows)::$why"
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### libmpv (Windows): SKIP`n`n$why"
                  Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'available=false'
                  exit 0
              }
          }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:MPV_SHA256) {
              Remove-Item -LiteralPath $file -Force
              throw "the archive has SHA-256 $hash, pinned is $env:MPV_SHA256: not used"
          }
          Write-Output "$env:MPV_ARCHIVE, SHA-256 as pinned"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'available=true'
      # The recipe of docs/BUILD.md (section Windows, the variant without LLVM): only the mpv_* functions go into
      # the import library the MSVC linker needs.
      - name: Entpacken und mpv.lib erzeugen (Rezept aus BUILD.md)
        if: steps.archive.outputs.available == 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mpv-dev'
          7z x mpv-dev.7z "-o$dir" -y | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $msvc = Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') | Sort-Object Name -Descending | Select-Object -First 1
          $bin = Join-Path $msvc.FullName 'bin\Hostx64\x64'
          Push-Location $dir
          $exports = & (Join-Path $bin 'dumpbin.exe') /exports libmpv-2.dll |
              Select-String '\s(mpv_\S+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $exports) { throw 'no mpv_* export found in libmpv-2.dll' }
          Set-Content mpv.def -Value (@('LIBRARY libmpv-2.dll', 'EXPORTS') + $exports)
          & (Join-Path $bin 'lib.exe') /nologo /def:mpv.def /machine:x64 /out:mpv.lib
          if ($LASTEXITCODE -ne 0) { throw "lib failed ($LASTEXITCODE)" }
          Pop-Location
          Write-Output "$($exports.Count) functions in mpv.lib"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TAKT_LIBMPV_DIR=$dir"
          # The DLL is found through PATH when the tests start.
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir
      # The cache of the job "takt-demux und takt-decode mit FFmpeg 9.0" for Windows: the same file under the same key.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, resolved 2026-11-14
        if: steps.archive.outputs.available == 'true'
        with:
          path: ffmpeg-archive
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}
      - name: FFmpeg-Archiv holen, pruefen und FFMPEG_DIR setzen (fuer den Vergleich mit der eigenen Pipeline)
        id: ffmpeg
        if: steps.archive.outputs.available == 'true'
        shell: bash
        run: |
          file=ffmpeg-archive
          if [ ! -f "$file" ]; then
            url="https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_ARCHIVE"
            status=$(curl -sSL --retry 3 --retry-delay 5 -o "$file" -w '%{http_code}' "$url")
            if [ "$status" = 404 ]; then
              rm -f "$file"
              why="$FFMPEG_ARCHIVE is gone from its publisher (HTTP 404): the own pipeline was not compared with libmpv. Pin a newer archive in ci.yml and docs/BUILD.md."
              echo "::warning title=SKIP eigene Pipeline gegen libmpv (Windows)::$why"
              {
                echo "### Eigene Pipeline gegen libmpv (Windows): SKIP"
                echo
                echo "$why"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" != 200 ]; then
              rm -f "$file"
              echo "download failed with HTTP $status"
              exit 1
            fi
          fi
          if ! echo "$FFMPEG_SHA256  $file" | sha256sum -c -; then
            rm -f "$file"
            echo "the archive does not have the pinned SHA-256: not used"
            exit 1
          fi
          dest="$(cygpath -m "$RUNNER_TEMP")/ffmpeg"
          mkdir -p "$dest"
          7z x "$file" "-o$dest" -y > /dev/null
          root="$dest/${FFMPEG_ARCHIVE%.zip}"
          test -d "$root/include/libavcodec" && test -d "$root/lib"
          echo "FFMPEG_DIR=$root" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Link-Test, Clippy und alle Tests des Players mit libmpv
        if: steps.archive.outputs.available == 'true'
        shell: bash
        env:
          WITH_FFMPEG: ${{ steps.ffmpeg.outputs.available }}
        run: |
          cargo test -p takt-player --test ffi_native_link -- --nocapture 2>&1 | tee test.log
          # The cfg must have come on: both libmpv tests ran, not the stand-in that says SKIP.
          grep -q "test libmpv::client_api_is_version_2 ... ok" test.log
          grep -q "test libmpv::license_state_matches_build_md ... ok" test.log
          cargo clippy -p takt-player --all-targets --all-features
          # Silent (ao=null), as on Ubuntu: the MpvBackend plays the test files of the repository. The two helper
          # programs of the own pipeline are built in the same run: the tests of the player start them.
          cargo test -p takt-demux -p takt-decode -p takt-player -- --nocapture 2>&1 | tee -a test.log
          grep -q "test mpv::tests::a_test_pattern_is_rendered_into_memory ... ok" test.log
          grep -q "test mpv::backend::tests::a_file_plays_pauses_jumps_and_ends ... ok" test.log
          grep -q "test mpv::backend::tests::the_frames_are_bt709_whatever_primaries_the_file_names ... ok" test.log
          grep -q "test mpv::backend::tests::rounds_of_loading_jumping_and_switching_subtitles_hold_nothing_up ... ok" test.log
          grep -q "test session::tests::a_file_swaps_the_clock_and_the_test_picture_swaps_it_back ... ok" test.log
          if [ "$WITH_FFMPEG" = true ]; then
            # The own pipeline against libmpv: same file, same timestamp, PSNR above the threshold; and the two
            # backends swapped while a file plays.
            grep -q "test compare::the_own_pipeline_shows_the_picture_libmpv_shows_at_the_same_time ... ok" test.log
            grep -q "test compare::a_picture_one_frame_off_or_of_the_wrong_matrix_fails_the_threshold ... ok" test.log
            grep -q "test session::tests::a_file_plays_through_the_own_pipeline_on_the_clock_of_the_player ... ok" test.log
            grep -q "test session::tests::the_pipelines_are_swapped_while_a_file_plays_and_it_goes_on_where_it_was ... ok" test.log
            {
              echo "### Eigene Pipeline gegen libmpv (Windows)"
              echo
              echo '```'
              grep -E "pictures at the same timestamp|the picture after" test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: SKIPs in die Zusammenfassung
        if: always() && steps.archive.outputs.available == 'true'
        shell: bash
        run: python scripts/ci-skip-summary.py test.log --title "libmpv (Windows)"

  # takt-demux and takt-decode with a real FFmpeg: the only job that compiles, lints and runs the bindings to
  # libavformat and libavcodec (the modules ffi of the two helper programs exist only with FFMPEG_DIR), demuxes
  # files and decodes them; every other job builds the crates without FFmpeg, where the helpers answer "built
  # without FFmpeg". The archives are the LGPL shared builds of
  # FFmpeg 9.0 from BtbN/FFmpeg-Builds (docs/BUILD.md), a monthly release their publisher keeps, taken only with
  # the SHA-256 below. Should an archive be gone, the job says SKIP in a warning and in the summary and counts as
  # no evidence (TST-16); then pin a newer one here and in docs/BUILD.md. A file with another hash fails the job.
  ffmpeg:
    name: takt-demux und takt-decode mit FFmpeg 9.0 (${{ matrix.os }}, Archiv gepinnt)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-lgpl-shared-9.0.tar.xz
            sha256: 5a58e2dffad4835ee3418939f2676d6898489f8e047299f5f62ee0da3f8dd5dc
          - os: windows-latest
            archive: ffmpeg-n9.0.2-39-g7adfbe40dc-win64-lgpl-shared-9.0.zip
            sha256: e907b01fa4783913151237e37df2a10fa97d99a1598a021bf59d4ae62ffed4c0
    env:
      FFMPEG_TAG: autobuild-2026-10-31-12-59
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
        # The tests load a library that is not ours: the token of the run does not stay in the checkout.
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, resolved 2026-11-14
        with:
          path: ffmpeg-archive
          key: ffmpeg-${{ matrix.sha256 }}
      - name: Archiv holen und gegen den SHA-256 pruefen
        id: archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          file=ffmpeg-archive
          if [ ! -f "$file" ]; then
            url="https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$ARCHIVE"
            status=$(curl -sSL --retry 3 --retry-delay 5 -o "$file" -w '%{http_code}' "$url")
            if [ "$status" = 404 ]; then
              rm -f "$file"
              why="$ARCHIVE is gone from its publisher (HTTP 404): nothing of takt-demux and takt-decode was built or tested with FFmpeg on ${{ matrix.os }}. Pin a newer archive in ci.yml and docs/BUILD.md."
              echo "::warning title=SKIP takt-demux und takt-decode mit FFmpeg (${{ matrix.os }})::$why"
              {
                echo "### takt-demux und takt-decode mit FFmpeg (${{ matrix.os }}): SKIP"
                echo
                echo "$why"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" != 200 ]; then
              rm -f "$file"
              echo "download failed with HTTP $status"
              exit 1
            fi
          fi
          if ! echo "$SHA256  $file" | sha256sum -c -; then
            rm -f "$file"
            echo "the archive does not have the pinned SHA-256: not used"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      # The recipe of docs/BUILD.md: FFMPEG_DIR is the root with include/ and lib/, and the libraries must be found
      # when the helper starts (PATH under Windows, LD_LIBRARY_PATH under Linux).
      - name: Entpacken und FFMPEG_DIR setzen (Rezept aus BUILD.md)
        if: steps.archive.outputs.available == 'true'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          # Under Windows the path gets forward slashes (D:/a/_temp): bash and Rust both take that.
          if [ "$RUNNER_OS" = Windows ]; then
            dest="$(cygpath -m "$RUNNER_TEMP")/ffmpeg"
          else
            dest="$RUNNER_TEMP/ffmpeg"
          fi
          mkdir -p "$dest"
          case "$ARCHIVE" in
            *.zip) 7z x ffmpeg-archive "-o$dest" -y > /dev/null ;;
            *) tar -xJf ffmpeg-archive -C "$dest" ;;
          esac
          root="$dest/${ARCHIVE%.zip}"
          root="${root%.tar.xz}"
          test -d "$root/include/libavformat" && test -d "$root/lib"
          echo "FFMPEG_DIR=$root" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$root/bin" >> "$GITHUB_PATH"
          else
            echo "$root/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
          fi
      - name: Clippy und Tests von takt-demux und takt-decode mit FFmpeg
        if: steps.archive.outputs.available == 'true'
        shell: bash
        run: |
          # The modules ffi exist only with the cfg: no other job compiles, lints or tests them.
          cargo clippy -p takt-demux -p takt-decode --all-targets --all-features
          # Both packages in one run: the tests of takt-decode start the demux helper too.
          cargo test -p takt-demux -p takt-decode -- --nocapture 2>&1 | tee test.log
          # The cfg must have come on: files were demuxed, not the stand-in that says SKIP.
          grep -q "test with_ffmpeg::mkv_with_picture_sound_and_subtitles_matches_ffprobe ... ok" test.log
          grep -q "test with_ffmpeg::mp4_with_h264_matches_ffprobe ... ok" test.log
          grep -q "test with_ffmpeg::webm_with_vp9_matches_ffprobe ... ok" test.log
          grep -q "test with_ffmpeg::a_seek_lands_on_the_keyframe_before_the_target_and_the_file_reads_on ... ok" test.log
          grep -q "test with_ffmpeg::damaged_files_end_in_an_answer ... ok" test.log
          grep -q "test with_ffmpeg::the_ffmpeg_of_the_helper_is_an_lgpl_build ... ok" test.log
          # The same for the decoder: pictures were decoded and compared with what ffmpeg decodes.
          grep -q "test with_ffmpeg::h264_hevc_and_av1_decode_to_the_bytes_ffmpeg_decodes ... ok" test.log
          grep -q "test with_ffmpeg::the_same_pictures_arrive_as_nv12_and_p010 ... ok" test.log
          grep -q "test with_ffmpeg::an_empty_pool_stalls_the_decoder_and_nothing_is_lost_or_allocated ... ok" test.log
          grep -q "test with_ffmpeg::a_flush_drops_what_was_on_its_way_and_the_new_position_plays ... ok" test.log
          grep -q "test with_ffmpeg::the_backend_plays_every_picture_of_a_file_on_a_clock_that_does_not_drop ... ok" test.log
          grep -q "test with_ffmpeg::the_ffmpeg_of_the_helper_is_an_lgpl_build_with_dav1d ... ok" test.log
      - name: SKIPs in die Zusammenfassung
        if: always() && steps.archive.outputs.available == 'true'
        shell: bash
        run: python scripts/ci-skip-summary.py test.log --title "takt-demux und takt-decode mit FFmpeg (${{ matrix.os }})"

  licenses:
    name: Lizenzen und Sicherheitshinweise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2, resolved 2026-11-12
        with:
          command: check all

  zone1:
    name: Zone 1 baut allein und bleibt frei von Copyleft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [takt-core, takt-clock, takt-audio, takt-ipc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: Bauen ohne den Rest des Workspace
        run: cargo build -p ${{ matrix.crate }} --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2, resolved 2026-11-12
        with:
          manifest-path: crates/${{ matrix.crate }}/Cargo.toml
          arguments: --config deny-zone1.toml
          command: check licenses

  msrv:
    name: Mindest-Rust-Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0, resolved 2026-11-12
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: ALSA- und D-Bus-Header (cpal unter Linux, rtkit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - run: cargo check --workspace --all-features
