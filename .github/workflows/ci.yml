# SPDX-License-Identifier: GPL-3.0-or-later
#
# Cross-Platform ab Commit eins. Nicht "spaeter ergaenzen": der Moment, in dem
# eine Plattform drei Wochen nicht gebaut wurde, ist der Moment, in dem sie
# kaputt ist.
#
# macOS laeuft mit, obwohl es kein Testgeraet gibt. Ein gruener Build ist keine
# Zusage, dass es dort gut laeuft — aber ein roter Build ist der Beweis, dass
# es das nicht tut.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      # The branch `stable` of the action at its commit of that day; the toolchain is an input then.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: ALSA-Header (cpal unter Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Tests
        shell: bash
        run: cargo test --workspace --all-features 2>&1 | tee test.log
      # Ignored tests are no evidence (TST-16): their number and reasons go into the summary of the run.
      - name: SKIPs in die Zusammenfassung
        if: always()
        shell: bash
        run: python3 scripts/ci-skip-summary.py test.log --title "Tests ${{ matrix.os }}"
      # The shader against its CPU reference. The runners have no GPU; on Windows the software adapter of DX12 (WARP)
      # renders it. Linux and macOS keep the test ignored.
      - name: Shader gegen die CPU-Referenz (Windows, WARP)
        if: runner.os == 'Windows'
        run: cargo test -p takt-player gpu -- --ignored --nocapture
        env:
          TAKT_GPU_TESTS: "1"
          TAKT_GPU_ADAPTER: fallback
      # Packing, install and uninstall of the rolling zip, with a stand-in program and throw-away places.
      - name: Install-Skripte (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/test-release.ps1
      - name: Doku baut ohne fehlende Verweise
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  text:
    name: Keine Steuerzeichen in Textdateien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - name: Steuerzeichen-Guard (NREL-14)
        run: python3 scripts/check-control-chars.py
      - name: Jede uses-Zeile per SHA gepinnt (NREL-03)
        run: python3 scripts/check-action-pins.py

  # libmpv from the distribution (a GPL build, accepted for zone 2 on 2026-10-31): the link smoke test runs for
  # real here; without it the test says SKIP. FFmpeg of Ubuntu is a GPL build and stays out (build_is_lgpl).
  libmpv-linux:
    name: libmpv gelinkt (Ubuntu, apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: ALSA- und libmpv-Header
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libmpv-dev pkg-config
      # The recipe of docs/BUILD.md (section Linux), word for word.
      - name: Link-Test gegen libmpv (Rezept aus BUILD.md)
        run: |
          echo "libmpv $(pkg-config --modversion mpv) in $(pkg-config --variable=libdir mpv)"
          TAKT_LIBMPV_DIR="$(pkg-config --variable=libdir mpv)" && [ -n "$TAKT_LIBMPV_DIR" ] \
              && export TAKT_LIBMPV_DIR && cargo test -p takt-player --test ffi_native_link -- --nocapture 2>&1 | tee test.log
          # The cfg must have come on: both libmpv tests ran, not the stand-in that says SKIP.
          grep -q "test libmpv::client_api_is_version_2 ... ok" test.log
          grep -q "test libmpv::license_state_matches_build_md ... ok" test.log
      - name: SKIPs in die Zusammenfassung
        if: always()
        run: python3 scripts/ci-skip-summary.py test.log --title "libmpv (Ubuntu)"

  licenses:
    name: Lizenzen und Sicherheitshinweise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2, resolved 2026-11-12
        with:
          command: check all

  zone1:
    name: Zone 1 baut allein und bleibt frei von Copyleft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [takt-core, takt-clock, takt-audio]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, resolved 2026-11-12
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: Bauen ohne den Rest des Workspace
        run: cargo build -p ${{ matrix.crate }} --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2, resolved 2026-11-12
        with:
          manifest-path: crates/${{ matrix.crate }}/Cargo.toml
          arguments: --config deny-zone1.toml
          command: check licenses

  msrv:
    name: Mindest-Rust-Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-12
      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0, resolved 2026-11-12
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, resolved 2026-11-12
      - name: ALSA-Header (cpal unter Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace --all-features
