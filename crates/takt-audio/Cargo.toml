# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "takt-audio"
version = "0.0.1"
description = "Audio path of Takt: the wait-free ring between the decoder and the audio callback"
license = "Apache-2.0 OR MIT"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The device output (cpal). Off by default: the ring and the callback are
# usable and testable without a sound system, and zone 1 stays buildable
# where no audio headers are installed.
cpal = ["dep:cpal"]

[dependencies]
takt-clock.workspace = true
# Without `disable_release`: the guard aborts on an allocation in release
# builds too (it only acts where the program installs its AllocDisabler).
assert_no_alloc = { version = "1.1", default-features = false }
cpal = { version = "0.18", optional = true }

[lints]
workspace = true
