# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "takt-player"
version = "0.0.1"
description = "Takt Player"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
takt-core.workspace = true
takt-clock.workspace = true
takt-backend = { path = "../../crates/takt-backend", version = "0.0.1" }
takt-audio = { workspace = true, features = ["cpal"] }
# The picture on the GPU: the layer the video surface is drawn with (src/render).
takt-gpu = { path = "../../crates/takt-gpu", version = "0.0.1" }
# Only for its feature: cpal asks for real-time priority on its audio thread. Pulls audio_thread_priority
# (MPL-2.0), allowed here in zone 2 and never in takt-audio (zone 1). `realtime-dbus` lets it ask rtkit over D-Bus on
# Linux, so no rtprio limit is needed (decided 2026-11-15); that pulls dbus and libdbus-sys (MIT OR Apache-2.0) and
# links the system's libdbus-1 (build: libdbus-1-dev). Elsewhere it changes nothing.
cpal = { version = "0.18", features = ["realtime-dbus"] }
# The window (NREL-02): egui for the frame UI and wgpu for the video, as KONZEPT.md decided. 0.33 is the
# newest eframe for rust-version 1.90. No glow: the video is drawn with wgpu, one renderer is enough.
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui = "0.33"
# Its default features turn on the wgpu backends (DX12, Vulkan, Metal, GL); without them wgpu has none.
egui-wgpu = "0.33"
# What the default of eframe would bring for winit on Linux: load libwayland at run time (no build
# dependency) and draw its own window decorations where Wayland gives none (GNOME).
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }
# The guard of the audio callback: without `disable_release`, so it aborts in release builds too.
assert_no_alloc = { version = "1.1", default-features = false }
# Real-time priority for the feeder of the audio ring, as cpal asks it for the callback: under load a feeder of
# normal priority starved and the ring ran dry (docs/reviews/phase-0.md, "Xruns unter Nebenlast"; decided
# 2026-11-16). Already in the tree through cpal (MPL-2.0, zone 2 only); its D-Bus feature comes from cpal's
# `realtime-dbus`.
audio_thread_priority = { version = "0.35", default-features = false }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# `takt-player --uninstall`, what the entry in Settings > Apps runs (src/uninstall.rs): the program removes its
# install in its own process. A crate of the author's kit (MIT, no dependency of its own), by tag; Cargo.lock
# pins the commit. Zone 2 only: the zone 1 crates never see it.
# The version is the one the kit's crates carry (the tag is the version); named so cargo deny sees no wildcard.
appkit-uninstall = { git = "https://github.com/WKDSteve/appkit", tag = "v0.55.1", version = "0.0.0" }

[lints]
workspace = true
